name: Godot Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/android-export-signing-diagnostics]

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Android debug export environment
        shell: bash
        run: |
          set -euo pipefail
          export HOME=/github/home
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          TEMPLATE_DIR="$(find / -type f -name android_debug.apk -path '*/export_templates/*' -print -quit 2>/dev/null || true)"
          if [ -n "$TEMPLATE_DIR" ]; then
            cp "$(dirname "$TEMPLATE_DIR")/android_debug.apk" "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
            cp "$(dirname "$TEMPLATE_DIR")/android_release.apk" "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          else
            curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
            unzip -q /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' -d /tmp/godot-export
            cp /tmp/godot-export/templates/android_*.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          fi
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "GODOT_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=MCX,C=MY"
          fi
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "SDK directory: $SDK_DIR"
          SDKMANAGER="$(find "$SDK_DIR" /opt /usr/local -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
          test -f "$SDK_DIR/build-tools/35.0.0/aapt2"
          test -f "$SDK_DIR/build-tools/34.0.0/aapt2"
          test -f "$SDK_DIR/platforms/android-35/android.jar"
          echo "Android SDK Build Tools 35.0.0 installed"
          ls -la "$SDK_DIR/build-tools"
          echo "Godot editor settings path: $HOME/.config/godot/editor_settings-4.4.tres"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_DIR"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "Confirm Godot editor settings:"
          grep -E "export/android/(android_sdk_path|java_sdk_path|debug_keystore)" "$HOME/.config/godot/editor_settings-4.4.tres" | sed -E 's/(pass = ).*/\1[REDACTED]/'
          test -d "$SDK_DIR/platforms/android-35"
      - name: Import Godot project
        run: godot --headless --editor --path . --import --quit
      - name: Diagnose Android export configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Effective paths ==="
          printf 'HOME=%s\\nANDROID_HOME=%s\\nANDROID_SDK_ROOT=%s\\nJAVA_HOME=%s\\n' "$HOME" "${ANDROID_HOME:-unset}" "${ANDROID_SDK_ROOT:-unset}" "${JAVA_HOME:-unset}"
          echo "=== SDK package metadata ==="
          for pkg in "$ANDROID_HOME"/build-tools/*/source.properties "$ANDROID_HOME"/platforms/*/source.properties; do
            echo "--- $pkg"
            grep -E "^(Pkg.Revision|AndroidVersion.ApiLevel|Pkg.Path)=" "$pkg" || true
          done
          echo "=== SDK build tools ==="
          ls -la "$ANDROID_HOME/build-tools"
          echo "=== SDK platforms ==="
          ls -la "$ANDROID_HOME/platforms"
          echo "=== Godot editor settings ==="
          ls -la "$HOME/.config/godot"
          grep -E 'export/android/(android_sdk_path|java_sdk_path) ' "$HOME/.config/godot/editor_settings-4.4.tres" || true
          echo "=== Godot templates ==="
          ls -lh "$HOME/.local/share/godot/export_templates/4.4.1.stable"/android_*.apk
          echo "=== SDK key files ==="
          ls -l "$ANDROID_HOME/build-tools/35.0.0/aapt2" "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "=== Export preset ==="
          grep -E '^(name|platform|package/unique_name|gradle_build/use_gradle_build)=' export_presets.cfg || true
      - name: Configure explicit debug signing
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/.android/debug.keystore"
          # Minimal Godot CI container does not include Python.
          # Modify only the checked-in blank debug signing fields.
          grep -qx 'keystore/debug=""' export_presets.cfg
          grep -qx 'keystore/debug_user=""' export_presets.cfg
          grep -qx 'keystore/debug_password=""' export_presets.cfg
          sed -i \
            -e "s|^keystore/debug=\"\"$|keystore/debug=\"$HOME/.android/debug.keystore\"|" \
            -e 's|^keystore/debug_user=""$|keystore/debug_user="androiddebugkey"|' \
            -e 's|^keystore/debug_password=""$|keystore/debug_password="android"|' \
            export_presets.cfg
          grep -q "^keystore/debug=\"$HOME/.android/debug.keystore\"$" export_presets.cfg
          echo "Debug signing preset configured"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "Debug keystore alias verified"
      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/mcx-godot-test-debug.apk
          test -s build/mcx-godot-test-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mcx-godot-test-debug
          path: build/mcx-godot-test-debug.apk
          if-no-files-found: error
